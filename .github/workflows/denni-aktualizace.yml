name: Denní aktualizace dat

on:
  schedule:
    # 22:35 UTC v pracovní dny = po zavření burzy v New Yorku (zimní i letní čas)
    - cron: "35 22 * * 1-5"
    # záložní běh ráno, kdyby večerní běh nedostal konečné hodnoty
    - cron: "17 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data a vytvořit data.json
        run: python aktualizuj.py
      - name: Uložit změny
        run: |
          git config user.name "aktualizace-dat"
          git config user.email "actions@users.noreply.github.com"
          git add data data.json
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "Aktualizace dat $(date -u +%Y-%m-%d)"
            git push
          fi
